name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./ci.db"
          ENVIRONMENT: "test"
          JWT_SECRET: "ci-secret-key-at-least-32-bytes-long-000"
        run: pytest -q

      - name: Financial correctness benchmark
        env:
          DATABASE_URL: "sqlite:///./ci.db"
        run: python -m scripts.benchmark

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: "sqlite:///./mig.db"
          ENVIRONMENT: "production"
        run: alembic upgrade head
