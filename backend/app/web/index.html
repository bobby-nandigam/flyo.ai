<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TravelRefund Intelligence</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --sidebar:#0f1729; --sidebar-2:#1b2537;
    --side-ink:#9aa6bd; --side-active:#ffffff;
    --ink:#111827; --ink-2:#374151; --muted:#6b7280; --line:#e6e8ec; --line-2:#eef0f3;
    --accent:#2563eb; --accent-ink:#1d4ed8; --accent-weak:#eef3ff;
    --good:#047857; --good-weak:#ecfdf5; --warn:#b45309; --warn-weak:#fff7ed;
    --bad:#b91c1c; --bad-weak:#fef2f2; --indigo:#4338ca; --indigo-weak:#eef2ff;
    --radius:10px; --shadow:0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .hidden{display:none !important}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--accent);text-decoration:none}

  /* ---------- Login ---------- */
  .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:30px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--sidebar);display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:15px}
  .auth-card h1{font-size:16px;margin:16px 0 2px;letter-spacing:-.2px}
  .auth-card .tag{color:var(--muted);font-size:12.5px;margin-bottom:22px}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;font-size:13px;
    font-weight:600;border:1px solid transparent;background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-ink)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
  .btn.ghost:hover{background:#f8fafc;border-color:#d7dbe2}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.block{width:100%;justify-content:center;padding:11px}
  .err{background:var(--bad-weak);color:var(--bad);border:1px solid #f3c9c9;border-radius:8px;
    padding:9px 11px;font-size:13px;margin-top:14px}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:14px}
  .hint code{background:#f1f3f6;padding:2px 6px;border-radius:5px;color:var(--ink-2)}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:236px;background:var(--sidebar);color:#fff;position:fixed;inset:0 auto 0 0;
    display:flex;flex-direction:column;padding:16px 12px;z-index:20}
  .sidebar .brand{padding:6px 8px 16px;border-bottom:1px solid var(--sidebar-2)}
  .sidebar .brand .logo{background:#fff;color:var(--sidebar)}
  .sidebar .brand .nm{font-size:13.5px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
  .sidebar .brand .sub{font-size:10.5px;color:var(--side-ink);font-weight:500}
  .nav{margin-top:12px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--side-ink);
    font-size:13px;font-weight:500}
  .nav a:hover{background:var(--sidebar-2);color:#fff}
  .nav a.active{background:var(--accent);color:#fff}
  .nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5b6986;padding:14px 10px 6px;font-weight:700}
  .side-foot{border-top:1px solid var(--sidebar-2);padding:12px 10px 4px;font-size:11.5px;color:var(--side-ink)}
  .side-foot b{color:#fff;font-weight:600;display:block;font-size:12.5px}

  .main{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}
  .topbar h2{font-size:15px;margin:0;font-weight:650;letter-spacing:-.2px}
  .topbar .crumb{font-size:12px;color:var(--muted)}
  .content{padding:24px 26px 64px;max-width:1240px;width:100%}

  /* ---------- Bits ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:700;margin:26px 0 12px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .tile .v{font-size:21px;font-weight:700;margin-top:9px;letter-spacing:-.4px;color:var(--ink)}
  .tile.red .v{color:var(--bad)} .tile.green .v{color:var(--good)}
  .tile .sub{font-size:11.5px;color:var(--muted);margin-top:3px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card .hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-2)}
  .card .hd h4{margin:0;font-size:13.5px;font-weight:650}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 16px;font-size:13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbfc}
  td.num,th.num{text-align:right}
  .sub{color:var(--muted);font-size:11.5px}
  .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}
  .skeleton{height:14px;background:linear-gradient(90deg,#eef0f3,#eef0f3);border-radius:4px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:650;white-space:nowrap}
  .bg-blue{background:var(--accent-weak);color:var(--accent-ink)}
  .bg-green{background:var(--good-weak);color:var(--good)}
  .bg-amber{background:var(--warn-weak);color:var(--warn)}
  .bg-red{background:var(--bad-weak);color:var(--bad)}
  .bg-indigo{background:var(--indigo-weak);color:var(--indigo)}
  .bg-gray{background:#f1f3f6;color:var(--ink-2)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0;cursor:pointer}
  .neg{color:var(--bad);font-weight:650}

  /* ---------- Drawer & modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,41,.42);z-index:40;display:flex}
  .drawer{width:min(560px,100%);margin-left:auto;height:100%;background:#fff;overflow:auto;padding:22px 24px;box-shadow:-10px 0 40px rgba(15,23,41,.2)}
  .modal{margin:auto;width:min(520px,94%);background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(15,23,41,.3);overflow:hidden}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line-2);font-weight:650;font-size:14.5px}
  .modal .mb{padding:18px 20px;max-height:66vh;overflow:auto}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px;background:#fafbfc}
  .field{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .posbar{display:flex;gap:10px;margin:14px 0}
  .posbar .p{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .posbar .p .k{font-size:11px;color:var(--muted);font-weight:600}
  .posbar .p .v{font-size:16px;font-weight:700;margin-top:4px}
  pre.draft{white-space:pre-wrap;font:12px/1.55 ui-monospace,Menlo,monospace;background:#fafbfc;
    border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;color:var(--ink-2)}

  /* ---------- Toast ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px}
  .toast.ok{background:#064e3b} .toast.bad{background:#7f1d1d}

  @media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:760px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="auth-wrap">
  <form class="auth-card" id="loginForm">
    <div class="brand"><div class="logo">₹</div></div>
    <h1>TravelRefund Intelligence</h1>
    <div class="tag">Every rupee accounted for. Every refund traceable.</div>
    <label for="email">Work email</label>
    <input id="email" type="email" autocomplete="username" value="demo-owner@flyo.test" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" value="demopassword1" required />
    <button class="btn block" type="submit" id="loginBtn" style="margin-top:20px">Sign in</button>
    <div id="loginErr" class="err hidden"></div>
    <div class="hint">Demo credentials pre-filled: <code>demo-owner@flyo.test</code> / <code>demopassword1</code>.
      All data is simulated — no real airline or payment systems are involved.</div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand" style="display:flex;gap:10px;align-items:center">
      <div class="logo">₹</div>
      <div><div class="nm">TravelRefund</div><div class="sub">Intelligence</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><b id="sideOrg">—</b><span id="sideUser">—</span>
      <div style="margin-top:6px;font-size:10px;color:#5b6986">build 2026-11-11 · v2</div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">Dashboard</h2><div class="crumb" id="pageCrumb"></div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="badge bg-gray" id="roleBadge">—</span>
        <button class="btn ghost sm" id="logoutBtn">Sign out</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="layer"></div>
<div id="toasts"></div>

<script>
const API="/api/v1";
let token=localStorage.getItem("flyo_token")||null, ME=null;
const cache={customers:[],suppliers:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,c="INR")=>(c==="INR"?"₹":c+" ")+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ICON={
  dash:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  trip:'<svg viewBox="0 0 24 24"><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/><circle cx="12" cy="12" r="9"/></svg>',
  case:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  recon:'<svg viewBox="0 0 24 24"><path d="M4 7h11M4 7l3-3M4 7l3 3M20 17H9M20 17l-3-3M20 17l-3 3"/></svg>',
  disc:'<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  pol:'<svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 5 3.4 7.7 8 9 4.6-1.3 8-4 8-9V7z"/></svg>',
  audit:'<svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
};

async function api(path,opts={}){
  const h=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,Object.assign({},opts,{headers:h}));
  if(r.status===401){logout();throw new Error("Session expired");}
  if(!r.ok){let d;try{d=(await r.json()).detail;}catch(e){} throw new Error(typeof d==="string"?d:(d?JSON.stringify(d):r.statusText));}
  return r.status===204?null:r.json();
}
function toast(msg,type=""){const t=document.createElement("div");t.className="toast "+(type);t.textContent=msg;$("toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ---------- Auth ---------- */
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("loginBtn");b.disabled=true;b.textContent="Signing in…";$("loginErr").classList.add("hidden");
  try{
    const d=await (await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:$("email").value,password:$("password").value})})).json();
    if(!d.access_token)throw new Error(d.detail||"Invalid credentials");
    token=d.access_token;localStorage.setItem("flyo_token",token);await boot();
  }catch(err){$("loginErr").textContent=err.message||"Login failed";$("loginErr").classList.remove("hidden");}
  finally{b.disabled=false;b.textContent="Sign in";}
});
$("logoutBtn").addEventListener("click",logout);
function logout(){token=null;ME=null;localStorage.removeItem("flyo_token");$("app").classList.add("hidden");$("login").classList.remove("hidden");}

const NAV=[
  {id:"dashboard",label:"Dashboard",icon:"dash"},
  {grp:"Operations"},
  {id:"trips",label:"Trips",icon:"trip"},
  {id:"cases",label:"Refund cases",icon:"case"},
  {id:"documents",label:"Documents",icon:"doc"},
  {grp:"Finance"},
  {id:"reconciliation",label:"Reconciliation",icon:"recon"},
  {id:"discrepancies",label:"Discrepancies",icon:"disc"},
  {id:"policies",label:"Policies",icon:"pol"},
  {grp:"Governance"},
  {id:"audit",label:"Audit history",icon:"audit"},
];
function renderNav(){
  $("nav").innerHTML=NAV.map(n=>n.grp?`<div class="grp">${n.grp}</div>`
    :`<a href="#/${n.id}" data-id="${n.id}">${ICON[n.icon]}<span>${n.label}</span></a>`).join("");
}

async function boot(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  renderNav();
  ME=await api("/auth/me");
  $("sideOrg").textContent="Himalaya Travels";$("sideUser").textContent=ME.email;
  $("roleBadge").textContent=ME.role;
  [cache.customers,cache.suppliers]=await Promise.all([api("/customers"),api("/suppliers")]);
  if(!location.hash)location.hash="#/dashboard";
  route();
}
window.addEventListener("hashchange",route);

const TITLES={dashboard:["Dashboard","Financial overview across all cancelled trips"],
  trips:["Trips","Cancelled trips and their bookings"],cases:["Refund cases","Expected, received and outstanding refunds"],
  reconciliation:["Reconciliation","Match imported bank & gateway records to the ledger"],
  discrepancies:["Discrepancies","Open financial exceptions, prioritised by exposure"],
  documents:["Documents","Cancellation documents and extracted fields"],
  policies:["Cancellation policies","Supplier deduction rules"],audit:["Audit history","Every recorded action"]};
function route(){
  const id=(location.hash.replace("#/","")||"dashboard");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.id===id));
  const t=TITLES[id]||["",""];$("pageTitle").textContent=t[0];$("pageCrumb").textContent=t[1];
  const fn={dashboard:viewDashboard,trips:viewTrips,cases:viewCases,reconciliation:viewReconciliation,
    discrepancies:viewDiscrepancies,documents:viewDocuments,policies:viewPolicies,audit:viewAudit}[id]||viewDashboard;
  $("view").innerHTML=`<div class="card"><div class="empty">Loading…</div></div>`;
  fn().catch(e=>{$("view").innerHTML=`<div class="card"><div class="empty">${esc(e.message)}</div></div>`;});
}

/* ---------- Status helpers ---------- */
const STATUS_BADGE=s=>{
  if(["REFUND_EXPECTED"].includes(s))return"bg-blue";
  if(["CUSTOMER_REFUNDED","SUPPLIER_REFUND_RECEIVED","CUSTOMER_PARTIALLY_REFUNDED"].includes(s))return"bg-green";
  if(["DISPUTED","MANUAL_REVIEW_REQUIRED","REJECTED"].includes(s))return"bg-red";
  return"bg-amber";};
const SEV_BADGE=s=>s==="HIGH"?"bg-red":s==="MEDIUM"?"bg-amber":"bg-blue";
const pretty=s=>String(s).replaceAll("_"," ").toLowerCase().replace(/^\w/,c=>c.toUpperCase());

/* ---------- Dashboard (progressive & resilient) ---------- */
function kpiTile(k,v,sub,cls){return `<div class="tile ${cls||""}"><div class="k">${k}</div><div class="v mono">${v}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;}
async function viewDashboard(){
  // Render the layout immediately so the page is never blank; fill each section as data arrives.
  $("view").innerHTML=`
    <div class="kpis" id="kpis">${Array(8).fill('<div class="tile"><div class="k">—</div><div class="v mono">…</div></div>').join("")}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px">
      <div class="card"><div class="hd"><h4>Outstanding supplier refunds</h4><a href="#/cases" class="linkbtn">All cases</a></div><div id="dashOut"><div class="empty">Loading…</div></div></div>
      <div class="card"><div class="hd"><h4>Open discrepancies</h4><a href="#/discrepancies" class="linkbtn">Queue</a></div><div id="dashDisc"><div class="empty">Loading…</div></div></div>
    </div>`;

  // KPIs — independent, render as soon as the summary returns.
  api("/dashboard/summary").then(s=>{
    $("kpis").innerHTML=[
      kpiTile("Cancelled trips",s.total_trips,`${s.total_bookings} bookings`),
      kpiTile("Original booking value",fmt(s.total_original_value)),
      kpiTile("Expected supplier refunds",fmt(s.total_expected_supplier_refund)),
      kpiTile("Supplier refunds received",fmt(s.total_supplier_refund_received),"","green"),
      kpiTile("Customer refunded",fmt(s.total_customer_refunded)),
      kpiTile("Outstanding from suppliers",fmt(s.total_outstanding),"","red"),
      kpiTile("Refund cases",s.total_refund_cases,`${s.open_outstanding_cases} with balance due`),
      kpiTile("Open discrepancies",(s.open_discrepancies??0),"",(s.open_discrepancies>0?"red":"")),
    ].join("");
  }).catch(e=>{$("kpis").innerHTML=`<div class="tile" style="grid-column:1/-1"><div class="sub">Couldn't load summary: ${esc(e.message)}</div></div>`;});

  // Discrepancies panel — independent.
  api("/reconciliation/discrepancies?status=OPEN").then(discs=>{
    $("dashDisc").innerHTML=discs.length?`<table><thead><tr><th>Type</th><th>Severity</th><th class="num">Amount</th></tr></thead>
      <tbody>${discs.slice(0,6).map(d=>`<tr><td>${pretty(d.kind)}</td><td><span class="badge ${SEV_BADGE(d.severity)}"><span class="dot"></span>${d.severity}</span></td>
      <td class="num mono">${fmt(d.observed_amount||d.expected_amount||d.difference)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No open discrepancies.</div>`;
  }).catch(()=>{$("dashDisc").innerHTML=`<div class="empty">Couldn't load discrepancies.</div>`;});

  // Outstanding cases — fetch cases, then settlements best-effort (allSettled).
  try{
    const cases=await api("/refund-cases");
    const settled=await Promise.allSettled(cases.map(c=>api(`/refund-cases/${c.id}/settlement?side=supplier`)));
    const withPos=cases.map((c,i)=>({...c,pos:settled[i].status==="fulfilled"?settled[i].value:null}));
    const outstanding=withPos.filter(c=>c.pos&&Number(c.pos.outstanding)>0).sort((a,b)=>Number(b.pos.outstanding)-Number(a.pos.outstanding));
    $("dashOut").innerHTML=outstanding.length?`<table><thead><tr><th>Case</th><th class="num">Expected</th><th class="num">Outstanding</th></tr></thead>
      <tbody>${outstanding.slice(0,6).map(c=>`<tr style="cursor:pointer" onclick='openCase("${c.id}")'>
      <td class="mono">${c.id.slice(0,8)}</td><td class="num mono">${fmt(c.expected_supplier_refund)}</td>
      <td class="num mono neg">${fmt(c.pos.outstanding)}</td></tr>`).join("")}</tbody></table>`
      :`<div class="empty">${cases.length?"No outstanding refunds.":"No refund cases yet."}</div>`;
  }catch(e){$("dashOut").innerHTML=`<div class="empty">Couldn't load cases.</div>`;}
}

/* ---------- Trips ---------- */
async function viewTrips(){
  const trips=await api("/trips");
  $("view").innerHTML=`

async function openCase(id){
  const [c,ledger,sup,invs]=await Promise.all([api(`/refund-cases/${id}`),api(`/refund-cases/${id}/ledger`),
    api(`/refund-cases/${id}/settlement?side=supplier`).catch(()=>null),api(`/refund-cases/${id}/investigations`).catch(()=>[])]);
  const lines=(c.supplier_breakdown&&c.supplier_breakdown.lines)||[];
  drawer(`Refund case`,`
    <div class="sub mono">${c.id}</div>
    <div style="margin:8px 0"><span class="badge ${STATUS_BADGE(c.status)}"><span class="dot"></span>${pretty(c.status)}</span></div>
    <div class="posbar">
      <div class="p"><div class="k">Expected</div><div class="v mono">${fmt(sup?sup.expected:c.expected_supplier_refund)}</div></div>
      <div class="p"><div class="k">Received</div><div class="v mono">${fmt(sup?sup.received:0)}</div></div>
      <div class="p"><div class="k">Outstanding</div><div class="v mono" style="${Number(sup?sup.outstanding:0)>0?'color:var(--bad)':''}">${fmt(sup?sup.outstanding:0)}</div></div></div>
    <div style="display:flex;gap:8px;margin:4px 0 8px">
      <button class="btn ghost sm" onclick='postRefund("${id}","supplier")'>Record supplier refund</button>
      <button class="btn ghost sm" onclick='postRefund("${id}","customer")'>Record customer refund</button></div>
    <h3 class="sec">Expected refund breakdown</h3>
    <div class="card"><table><tbody>
      ${lines.map(l=>`<tr><td>${esc(l.label)}<div class="sub">${l.kind} · ${esc(l.evidence_ref||"—")}</div></td><td class="num mono">${fmt(l.signed)}</td></tr>`).join("")}
      <tr><td><b>Expected supplier refund</b></td><td class="num mono"><b>${fmt((c.supplier_breakdown&&c.supplier_breakdown.total)||c.expected_supplier_refund)}</b></td></tr></tbody></table></div>
    <h3 class="sec">Ledger (append-only)</h3>
    <div class="card">${ledger.length?`<table><thead><tr><th>Account</th><th>Type</th><th class="num">Amount</th><th>Evidence</th></tr></thead>
      <tbody>${ledger.map(e=>`<tr><td><span class="badge ${e.account==="SUPPLIER"?"bg-blue":"bg-green"}">${e.account}</span></td>
      <td class="sub">${pretty(e.entry_type)}</td><td class="num mono">${fmt(e.amount,e.currency)}</td><td class="sub mono">${esc(e.evidence_ref)}</td></tr>`).join("")}</tbody></table>`
      :`<div class="empty">No ledger entries yet.</div>`}</div>
    <div class="row"><h3 class="sec">AI investigation</h3><div style="display:flex;gap:8px">
      <button class="btn ghost sm" onclick='runInvestigation("${id}")'>Investigate</button>
      <button class="btn ghost sm" onclick='draftFollowup("${id}")'>Draft follow-up</button></div></div>
    <div id="investBox" class="card" style="padding:14px">${invs.length?renderInvestigation(invs[0]):`<div class="sub">Run an evidence-grounded investigation to explain gaps and get recommended actions.</div>`}</div>`);
}
function renderInvestigation(r){
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><span class="badge ${SEV_BADGE(r.severity)}"><span class="dot"></span>${r.severity}</span>
    <span class="sub">engine: ${r.engine}${r.evidence_complete?" · evidence complete":""}</span></div>
    <div style="margin-bottom:10px">${esc(r.summary)}</div>
    ${r.findings.length?`<div class="sub" style="font-weight:700;margin-bottom:4px">FINDINGS</div><ul style="margin:0 0 12px;padding-left:18px">
      ${r.findings.map(f=>`<li style="margin-bottom:4px"><b>${pretty(f.code)}</b> — ${esc(f.message)} <span class="sub">${(f.evidence_refs||[]).join(", ")}</span></li>`).join("")}</ul>`:""}
    ${r.recommended_actions.length?`<div class="sub" style="font-weight:700;margin-bottom:4px">RECOMMENDED ACTIONS</div><ol style="margin:0;padding-left:18px">
      ${r.recommended_actions.map(a=>`<li style="margin-bottom:3px">${esc(a)}</li>`).join("")}</ol>`:""}`;
}
async function runInvestigation(id){$("investBox").innerHTML=`<div class="sub">Investigating…</div>`;
  try{const r=await api(`/refund-cases/${id}/investigate`,{method:"POST",body:"{}"});$("investBox").innerHTML=renderInvestigation(r);toast("Investigation complete","ok");}
  catch(e){$("investBox").innerHTML=`<div class="sub">${esc(e.message)}</div>`;}}
async function draftFollowup(id){try{const r=await api(`/refund-cases/${id}/followup-draft`,{method:"POST",body:"{}"});
  $("investBox").innerHTML=`<div class="row" style="margin-bottom:8px"><div class="sub" style="font-weight:700">SUPPLIER FOLLOW-UP DRAFT</div><span class="badge bg-amber">${r.status}</span></div>
  <pre class="draft">${esc(r.body)}</pre><div class="sub" style="margin-top:8px">Draft only — review and send via your own channel; nothing is transmitted automatically.</div>`;toast("Draft created","ok");}catch(e){toast(e.message,"bad");}}

async function openDoc(id){

  const cand=a=>a&&a.length?a.map(c=>`<span class="badge bg-gray" style="margin:2px 4px 2px 0">${esc(c.value)} · ${Math.round(Number(c.confidence)*100)}%</span>`).join(""):"—";
  drawer(`Document — ${esc(d.filename||"")}`,`
    <div style="margin-bottom:8px"><span class="badge ${d.status==="VERIFIED"?"bg-green":"bg-amber"}">${pretty(d.status)}</span></div>
    <h3 class="sec">Extracted fields</h3>
    <div class="card" style="padding:14px">
      <div class="field"><div class="sub" style="font-weight:700">AMOUNTS</div>${cand(ex.amounts)}</div>
      <div class="field"><div class="sub" style="font-weight:700">BOOKING REFERENCES</div>${cand(ex.booking_refs)}</div>
      <div class="field"><div class="sub" style="font-weight:700">DATES</div>${cand(ex.dates)}</div>
      <div><div class="sub" style="font-weight:700">SUPPLIER</div>${ex.supplier?`<span class="badge bg-indigo">${esc(ex.supplier.value)}</span>`:"—"}</div>
    </div>
    <h3 class="sec">Human verification</h3>
    <div class="card" style="padding:14px">
      ${d.extraction&&d.extraction.verified?`<div class="badge bg-green">Verified — ${fmt(d.extraction.verified_amount)} · ${esc(d.extraction.verified_booking_ref||"")}</div>`:`
      <div class="grid2"><div class="field"><label>Confirm amount</label><input id="vamt" value="${(ex.amounts&&ex.amounts[0])?ex.amounts[0].value:""}"></div>
        <div class="field"><label>Confirm booking ref</label><input id="vref" value="${(ex.booking_refs&&ex.booking_refs[0])?ex.booking_refs[0].value:""}"></div></div>
      <button class="btn sm" onclick='verifyDoc("${id}")'>Confirm extraction</button>`}
    </div>`);
}
async function verifyDoc(id){try{await api(`/documents/${id}/verify`,{method:"POST",body:JSON.stringify({amount:$("vamt").value,booking_ref:$("vref").value})});toast("Extraction verified","ok");closeLayer();route();}catch(e){toast(e.message,"bad");}}

    async()=>{const ded=[];if(Number($("pen").value)>0)ded.push({kind:"CANCELLATION_DEDUCTION",label:"Cancellation penalty",amount:$("pen").value,evidence_ref:"manual"});

/* ---------- Layer (drawer/modal) ---------- */
function drawer(title,bodyHTML){
  $("layer").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><div class="drawer">
    <div class="row" style="margin-bottom:6px"><h3 style="margin:0;font-size:16px">${title}</h3><button class="btn ghost sm" onclick="closeLayer()">Close</button></div>
    ${bodyHTML}</div></div>`;
}
function modal(title,bodyHTML,onSubmit,submitLabel="Create"){
  $("layer").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><div class="modal">
    <div class="mh">${title}</div><div class="mb" id="modalBody">${bodyHTML}</div>
    <div class="mf"><button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn" id="modalOk">${submitLabel}</button></div></div></div>`;
  $("modalOk").onclick=async()=>{const b=$("modalOk");b.disabled=true;b.textContent="Working…";
    try{await onSubmit();closeLayer();}catch(e){toast(e.message,"bad");b.disabled=false;b.textContent=submitLabel;}};
}
function closeLayer(){$("layer").innerHTML="";}

/* ---------- Resume ---------- */
if(token)boot().catch(()=>logout());
</script>
</body>
</html>
